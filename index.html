<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <header></header>
  <main id="main">
    <h1>
      Signup
    </h1>
    <form id="form">
      <input type="text" placeholder="Full Name" class="input2">
      <hr>
      <input type="email" placeholder="Email" class="input2">
      <hr>
      <input type="password" placeholder="Password" class="input2">
      <hr>
      <input type="text" placeholder="Confirm Password" class="input2">
      <hr>
      <input type="date" placeholder="mm-dd-yyyy" class="input2">
      <hr>

      <div class="div">
        <input type="radio" id="stud" name="Student" required>
        <label for="stud">Student</label>
        <input type="radio" id="employee" name="Student" required>
        <label for="employee">Employee</label>
      </div>
      <div class="div">
        <input type="checkbox">
        <label> I agree to all the Terms and conditions</label>
      </div>
      <button>Signup</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>

</html>
